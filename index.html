<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Zipbox</title>

    <!-- SEO -->
    <meta name="description"
      content="Zipbox - Modern locker and storage management platform." />
    <meta name="keywords"
      content="zipbox, smart locker, storage, management, react" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Zipbox" />
    <meta property="og:locale" content="vi_VN" />
    <meta property="og:title" content="Zipbox - Hệ Thống Tủ Khóa Thông Minh" />
    <meta property="og:description"
      content="Giải pháp tủ khóa thông minh hiện đại, giao nhận hàng 24/7 an toàn và tiện lợi." />
    <meta property="og:url" content="https://zipbox.id.vn/" />
    <meta property="og:image" content="https://zipbox.id.vn/pwa-512x512.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Zipbox - Hệ Thống Tủ Khóa Thông Minh" />
    <meta name="twitter:description"
      content="Giải pháp tủ khóa thông minh hiện đại, giao nhận hàng 24/7 an toàn và tiện lợi." />
    <meta name="twitter:image"
      content="https://zipbox.id.vn/pwa-512x512.png" />

    <!-- Theme color -->
    <meta name="theme-color" content="#ffffff" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />

    <!-- iOS PWA support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" /> <!-- fix deprecate -->
    <meta name="apple-mobile-web-app-title" content="Zipbox" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- iOS Icons -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Splash screen (iPhone/iPad) -->
    <link rel="apple-touch-startup-image" href="/pwa-512x512.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" href="/favicon.ico" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap"
      as="style"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap"
      />
    </noscript>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
